<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surfcasting Club Pro - V26.7 Zero-Freeze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans text-sm">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⚓</span>
                <h1 class="text-2xl font-bold tracking-wide bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">Surfcasting Club Pro</h1>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div id="zona-deslogado" class="flex items-center gap-2">
                    <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300 font-mono">Conta Gratuita</span>
                    <button onclick="simularLogin()" type="button" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg font-bold transition cursor-pointer">
                        ⭐ Ativar Modo Premium
                    </button>
                </div>
                
                <div id="zona-logado" class="hidden flex items-center gap-3 bg-slate-950/60 pl-3 pr-2 py-1 rounded-lg border border-slate-700">
                    <div class="text-left">
                        <p class="text-xs font-bold text-slate-200">Pescador_Pro</p>
                        <p class="text-[10px] text-emerald-400 font-mono">BI & Marés Ativo</p>
                    </div>
                    <button onclick="simularLogout()" type="button" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-red-400 p-1.5 rounded transition text-xs cursor-pointer">
                        Sair 👋
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
        
        <div class="border-b border-slate-700 flex flex-wrap gap-2">
            <button id="btn-tab-operacoes" onclick="mudarTab('operacoes')" type="button" class="border-b-2 border-blue-500 text-blue-400 px-5 py-2.5 font-bold text-xs uppercase tracking-wider cursor-pointer">
                📝 Diário de Bordo
            </button>
            <button id="btn-tab-analytics" onclick="mudarTab('analytics')" type="button" class="text-slate-400 hover:text-slate-200 px-5 py-2.5 font-bold text-xs uppercase tracking-wider cursor-pointer">
                📊 Painel Analítico BI
            </button>
        </div>

        <div id="conteudo-operacoes" class="space-y-8">
            
            <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-3">
                    <h2 class="text-base font-bold text-slate-200">📈 Sumário de Pesca</h2>
                    <span id="badge-modo" class="text-[10px] text-slate-400 font-mono uppercase">Modo Gratuito</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                    <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                        <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Saídas</span>
                        <span id="stat-total" class="text-3xl font-black text-blue-400">0</span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                        <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Peixes</span>
                        <span id="stat-peixes-total" class="text-3xl font-black text-emerald-400">0</span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                        <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Total Peso</span>
                        <span id="stat-peso-total" class="text-3xl font-black text-amber-400">0.0 <span class="text-xs font-normal text-slate-400">Kg</span></span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                        <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Média</span>
                        <span id="stat-media" class="text-3xl font-black text-cyan-400">0</span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                        <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Taxa Grade</span>
                        <span id="stat-grade" class="text-3xl font-black text-rose-500">0%</span>
                    </div>
                </div>
            </section>

            <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <h2 class="text-base font-bold text-blue-400 mb-6 border-b border-slate-700 pb-3">📝 Novo Registo Técnico</h2>
                <form id="form-pesca" onsubmit="event.preventDefault();" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-slate-500 text-[10px] uppercase mb-1 font-bold">📅 Data</label>
                            <input type="date" id="data" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-500 text-[10px] uppercase mb-1 font-bold">📍 Local</label>
                            <input type="text" id="local" placeholder="Ex: Setúbal" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-500 text-[10px] uppercase mb-1 font-bold">🌙 Lua</label>
                            <select id="lua" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                                <option value="Cheia">🌕 Lua Cheia</option>
                                <option value="Nova">🌑 Lua Nova</option>
                                <option value="Crescente">🌓 Quarto Crescente</option>
                                <option value="Minguante">🌗 Quarto Minguante</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-slate-500 text-[10px] uppercase mb-1 font-bold">⏱️ Hora Início</label>
                            <input type="time" id="hora-inicio" value="20:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-500 text-[10px] uppercase mb-1 font-bold">⏱️ Hora Fim</label>
                            <input type="time" id="hora-fim" value="01:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class
