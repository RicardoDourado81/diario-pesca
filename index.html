<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surfcasting Club Pro - V26.0 Modificada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .hidden { display: none !important; }
        .animate-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased text-sm">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-xl">⚓</span>
                <h1 class="text-base font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">Surfcasting Club Pro <span class="text-slate-500 font-normal text-xs">| V26.0_Mod</span></h1>
            </div>
            
            <div id="auth-area">
                <button id="btn-premium" onclick="togglePremium(true)" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg font-bold text-xs uppercase tracking-wider transition cursor-pointer">
                    Ativar Premium ⭐
                </button>
                <div id="user-logged" class="hidden flex items-center gap-3 bg-slate-950/50 px-3 py-1 rounded-lg border border-slate-800">
                    <span class="text-[10px] text-emerald-400 font-mono font-bold tracking-widest bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-900">PREMIUM</span>
                    <button onclick="togglePremium(false)" class="text-slate-400 hover:text-red-400 text-xs transition cursor-pointer">Sair</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-6">

        <div class="flex gap-2 border-b border-slate-700">
            <button onclick="switchTab('operacoes')" id="tab-operacoes" class="px-5 py-2.5 border-b-2 border-blue-500 text-blue-400 font-bold text-xs uppercase tracking-wider cursor-pointer">📝 Operações</button>
            <button onclick="switchTab('analytics')" id="tab-analytics" class="px-5 py-2.5 text-slate-400 hover:text-slate-200 font-bold text-xs uppercase tracking-wider cursor-pointer">📊 BI Analítico</button>
        </div>

        <div id="panel-operacoes" class="space-y-6 animate-in">
            
            <section class="grid grid-cols-2 md:grid-cols-5 gap-3">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700/60 text-center shadow-md">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1">Saídas</p>
                    <p id="stat-saidas" class="text-2xl font-black text-blue-400">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700/60 text-center shadow-md">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1">Peixes</p>
                    <p id="stat-peixes" class="text-2xl font-black text-emerald-400">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700/60 text-center shadow-md">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1">Peso Total</p>
                    <p id="stat-peso" class="text-2xl font-black text-amber-500">0.0 <span class="text-xs font-normal text-slate-400">Kg</span></p>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700/60 text-center shadow-md">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1">Média / Saída</p>
                    <p id="stat-media" class="text-2xl font-black text-cyan-400">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700/60 text-center shadow-md">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1">Taxa Grade</p>
                    <p id="stat-grade" class="text-2xl font-black text-rose-500">0%</p>
                </div>
            </section>

            <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-5 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> Introdução de Dados Técnicos
                </h2>
                
                <form id="form-registro" onsubmit="event.preventDefault();" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">📅 Data</label>
                            <input type="date" id="f-data" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">📍 Localização</label>
                            <input type="text" id="f-local" placeholder="Ex: Setúbal" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">🌙 Fase Lunar</label>
                            <select id="f-lua" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none">
                                <option value="Cheia">🌕 Lua Cheia</option>
                                <option value="Nova">🌑 Lua Nova</option>
                                <option value="Crescente">🌓 Quarto Crescente</option>
                                <option value="Minguante">🌗 Quarto Minguante</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">⏱️ Hora Início</label>
                            <input type="time" id="f-inicio" value="20:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">⏱️ Hora Fim</label>
                            <input type="time" id="f-fim" value="01:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">🌊 Comportamento Maré</label>
                            <select id="f-mare" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none">
                                <option value="Enchente">Enchente</option>
                                <option value="Vaza">Vaza</option>
                                <option value="Preamar">Preamar (Cheia)</option>
                                <option value="Baixa-mar">Baixa-mar (Vazia)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 border-t border-slate-700/60 pt-4">
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">🔢 N.º Peixes</label>
                            <input type="number" id="f-qtd" min="0" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">🐟 Espécies Alvo</label>
                            <input type="text" id="f-especies" placeholder="Ex: Douradas, Besugas" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-[10px] uppercase text-slate-400 font-bold mb-1 block">🐛 Iscos Utilizados</label>
                            <input type="text" id="f-iscos" placeholder="Ex: Casulo, Ganso" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100 outline-none">
                        </div>
                    </div>

                    <div class="p-4 rounded-xl border border-slate-700/60 bg-slate-900/30 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">⚡ Módulo Premium (Telemetria Opcional)</span>
                            <button id="btn-timestamp" type="button" onclick="addTimestamp()" class="bg-slate-700 text-slate-500 font-bold px-2.5 py-0.5 rounded text-[11px]" disabled>🎣 Log Toque</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="text-[9px] uppercase text-slate-500 block mb-1">Marcas Horárias</label>
                                <input type="text" id="f-toques" placeholder="Desativado" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-500 font-mono outline-none" disabled>
                            </div>
                            <div>
                                <label class="text-[9px] uppercase text-slate-500 block mb-1">Pressão (hPa)</label>
                                <input type="number" id="f-pressao" placeholder="Desativado" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-500 outline-none" disabled>
                            </div>
                            <div>
                                <label class="text-[9px] uppercase text-slate-500 block mb-1">Massa Total (Kg)</label>
                                <input type="number" id="f-peso" step="0.1" placeholder="Desativado" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-500 outline-none" disabled>
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="salvarItem()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-xs uppercase tracking-wider transition shadow-lg cursor-pointer">
                        💾 Arquivar Saída de Pesca
                    </button>
                </form>
            </section>

            <section class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
                <div class="p-4 bg-slate-800/50 border-b border-slate-700">
                    <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider">📋 Histórico Geral de Capturas</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-950/60 text-slate-400 uppercase font-mono tracking-wider text-[10px] border-b border-slate-700">
                                <th class="p-4">Data</th>
                                <th class="p-4">Local</th>
                                <th class="p-4">Lua</th>
                                <th class="p-4">Maré</th>
                                <th class="p-4">Toques Exatos</th>
                                <th class="p-4 text-right pr-6">Qtd</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="divide-y divide-slate-800 text-slate-300">
                            </tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="panel-analytics" class="hidden space-y-6 animate-in">
            
            <div id="bi-lock" class="bg-slate-800 border border-slate-700 p-12 rounded-xl text-center shadow-2xl">
                <span class="text-4xl block mb-3">🔒</span>
                <h3 class="text-base font-bold text
