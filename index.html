<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surfcasting Club Pro - V29.0 Estabilidade Pura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans text-sm">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⚓</span>
                <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">Surfcasting Club Pro</h1>
            </div>
            
            <div id="auth-zone">
                <button id="btn-ativar-premium" onclick="mudarModo(true)" type="button" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg font-bold text-xs transition cursor-pointer uppercase">
                    ⭐ Modo Premium
                </button>
                <div id="box-status-logado" class="hidden flex items-center gap-3 bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span class="text-[10px] text-emerald-400 font-mono font-bold uppercase">Premium Ativo</span>
                    <button onclick="mudarModo(false)" type="button" class="text-slate-400 hover:text-red-400 text-xs cursor-pointer">Sair 👋</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        
        <div class="border-b border-slate-700 flex gap-2">
            <button id="tab-btn-diario" onclick="alternarAbas('diario')" type="button" class="border-b-2 border-blue-500 text-blue-400 px-6 py-3 font-bold text-xs uppercase tracking-wider cursor-pointer">
                📝 Diário de Bordo
            </button>
            <button id="tab-btn-bi" onclick="alternarAbas('bi')" type="button" class="text-slate-400 hover:text-slate-200 px-6 py-3 font-bold text-xs uppercase tracking-wider cursor-pointer">
                📊 Análise BI
            </button>
        </div>

        <div id="view-diario" class="space-y-6">
            
            <section class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center">
                    <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Saídas</span>
                    <span id="txt-saidas" class="text-2xl font-black text-blue-400">0</span>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center">
                    <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Peixes</span>
                    <span id="txt-peixes" class="text-2xl font-black text-emerald-400">0</span>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center">
                    <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Total Peso</span>
                    <span id="txt-peso" class="text-2xl font-black text-amber-400">0.0 <span class="text-xs font-normal text-slate-400">Kg</span></span>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center">
                    <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Média</span>
                    <span id="txt-media" class="text-2xl font-black text-cyan-400">0</span>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center">
                    <span class="text-[10px] text-slate-500 block uppercase font-bold mb-1">Taxa Grade</span>
                    <span id="txt-grade" class="text-2xl font-black text-rose-500">0%</span>
                </div>
            </section>

            <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <h2 class="text-sm font-bold text-blue-400 mb-6 border-b border-slate-700 pb-3 uppercase tracking-wider">📝 Novo Registo Técnico</h2>
                <form id="form-pesca" onsubmit="event.preventDefault();" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">📅 Data</label>
                            <input type="date" id="inp-data" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">📍 Localização</label>
                            <input type="text" id="inp-local" placeholder="Ex: Setúbal" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">🌙 Lua</label>
                            <select id="inp-lua" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                                <option value="Cheia">🌕 Lua Cheia</option>
                                <option value="Nova">🌑 Lua Nova</option>
                                <option value="Crescente">🌓 Quarto Crescente</option>
                                <option value="Minguante">🌗 Quarto Minguante</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">⏱️ Hora Início</label>
                            <input type="time" id="inp-inicio" value="20:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">⏱️ Hora Fim</label>
                            <input type="time" id="inp-fim" value="01:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">🌊 Estado da Maré</label>
                            <select id="inp-mare" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                                <option value="Enchente">Enchente</option>
                                <option value="Vaza">Vaza</option>
                                <option value="Preamar">Preamar (Cheia)</option>
                                <option value="Baixa-mar">Baixa-mar (Vazia)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 border-t border-slate-700/60 pt-4">
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">🔢 N.º Peixes</label>
                            <input type="number" id="inp-qtd" min="0" placeholder="0 = Grade" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">🐟 Espécies</label>
                            <input type="text" id="inp-especies" placeholder="Ex: 3 Douradas" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-slate-400 text-[10px] uppercase mb-1 font-bold">🐛 Iscos Utilizados</label>
                            <input type="text" id="inp-iscos" placeholder="Ex: Casulo, Ganso" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none">
                        </div>
                    </div>

                    <div class="p-4 rounded
