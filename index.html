<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Surfcasting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⚓</span>
                <h1 class="text-2xl font-bold tracking-wide bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">Surfcasting Log</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button id="btn-admin-toggle" type="button" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition text-amber-400 cursor-pointer select-none">
                    <span id="txt-lock" class="pointer-events-none">🔒 Modo Consulta</span>
                </button>
                <button onclick="exportarDados()" type="button" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
                    📥 Exportar JSON
                </button>
                <button onclick="exportarCSV()" type="button" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
                    📄 Exportar CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 space-y-8">
            
            <section id="seccao-formulario" class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl hidden">
                <div class="flex items-center gap-2 mb-6 border-b border-slate-700 pb-3">
                    <span class="text-lg">➕</span>
                    <h2 class="text-xl font-semibold">Registar Nova Saída</h2>
                </div>
                
                <form id="form-pesca" onsubmit="guardarPesca(event)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Data</label>
                            <input type="date" id="data" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Local de Pesca</label>
                            <input type="text" id="local" placeholder="Ex: Praia da Tocha" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Fase da Lua</label>
                            <select id="lua" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                                <option value="Nova">🌑 Lua Nova</option>
                                <option value="Crescente">🌓 Quarto Crescente</option>
                                <option value="Cheia">🌕 Lua Cheia</option>
                                <option value="Minguante">🌗 Quarto Minguante</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-900/40 p-4 rounded-lg border border-slate-700/60">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">⏱️ Hora de Início</label>
                            <input type="time" id="hora-inicio" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">⏱️ Hora de Fim</label>
                            <input type="time" id="hora-fim" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">🔢 Total de Capturas</label>
                            <input type="number" id="total-capturas" min="0" placeholder="Ex: 3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Tipo de Maré</label>
                            <select id="mare-tipo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                                <option value="Enchente">🌊 Enchente</option>
                                <option value="Vaza">📉 Vaza</option>
                                <option value="Preamar">🔝 Preamar (Cheia)</option>
                                <option value="Baixa-mar">🛑 Baixa-mar (Vazia)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Altura da Maré (m)</label>
                            <input type="number" id="mare-altura" step="0.1" placeholder="Ex: 2.8" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Tamanho das Ondas (m)</label>
                            <input type="number" id="ondas" step="0.1" placeholder="Ex: 1.2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Vento (Direção/Força)</label>
                            <input type="text" id="vento" placeholder="Ex: Norte 15 km/h" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Iscos Utilizados (separados por vírgula)</label>
                        <input type="text" id="iscos" placeholder="Ex: Casulo, Ganso" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Especificação das Peças (Espécies, tamanhos, observações)</label>
                        <textarea id="peixes" rows="2" placeholder="Ex: 2 Robalos (35cm) ou escrever 'Grade'" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                        💾 Gravar Sessão de Pesca
                    </button>
                </form>
            </section>

            <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <div class="flex items-center gap-2 mb-6 border-b border-slate-700 pb-3">
                    <span class="text-lg">📋</span>
                    <h2 class="text-xl font-semibold">Histórico de Saídas</h2>
                </div>
                <div id="historico-lista" class="space-y-4 max-h-[600px] overflow-y-auto pr-2">
                    </div>
            </section>
        </div>

        <div class="space-y-8">
            <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl sticky top-24">
                <div class="flex items-center gap-2 mb-6 border-b border-slate-700 pb-3">
                    <span class="text-lg">📊</span>
                    <h2 class="text-xl font-semibold">Análise de Rendimento</h2>
                </div>

                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                            <span class="text-xs text-slate-400 block mb-1 uppercase tracking-wider">Total Saídas</span>
                            <span id="stat-total" class="text-3xl font-bold text-blue-400">0</span>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                            <span class="text-xs text-slate-400 block mb-1 uppercase tracking-wider">Taxa de Sucesso</span>
                            <span id="stat-sucesso" class="text-3xl font-bold text-emerald-400">0%</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-4">
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
                            <span class="text-xs text-slate-400 block mb-1 uppercase tracking-wider">Total de Peixes Capturados</span>
                            <span id="stat-peixes-total" class="text-3xl font-bold text-cyan-400">0</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Padrões de Sucesso</h3>
                        
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-3 text-sm">
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Melhor Local:</span>
                                <span id="best-local" class="font-medium text-slate-200">-</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Melhor Lua:</span>
                                <span id="best-lua" class="font-medium text-slate-200">-</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Melhor Maré:</span>
                                <span id="best-mare" class="font-medium text-slate-200">-</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Isco Mais Eficaz:</span>
                                <span id="best-isco" class="font-medium text-slate-200">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <script>
        const SENHA_ADMIN = "pesca123"; 
        let isAdmin = false;
        let pescas = [];

        // Carregar dados de forma segura
        try {
            const dadosLocais = localStorage.getItem('surfcasting_logs');
            if (dadosLocais) {
                pescas = JSON.parse(dadosLocais);
                if (!Array.isArray(pescas)) pescas = [];
            }
        } catch (e) {
            console.error("Erro ao ler localStorage:", e);
            pescas = [];
        }

        // Executa assim que o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', () => {
            const campoData = document.getElementById('data');
            if(campoData) {
                campoData.value = new Date().toISOString().substring(0, 10);
            }
            
            // Associação direta e prioritária do clique no botão
            const btnToggle = document.getElementById('btn-admin-toggle');
            if (btnToggle) {
                btnToggle.onclick = function(e) {
                    e.preventDefault();
                    toggleAdminMode();
                };
            }

            atualizarInterface();
        });

        function toggleAdminMode() {
            if (!isAdmin) {
                const senhaIntroduzida = prompt("Introduz a palavra-passe para ativares o modo de edição (registo):");
                if (senhaIntroduzida === SENHA_ADMIN) {
                    isAdmin = true;
                    alert("Acesso autorizado! O formulário de registo está agora disponível.");
                } else if (senhaIntroduzida !== null) {
                    alert("Palavra-passe incorreta. O sistema mantém-se em modo de consulta.");
                }
            } else {
                isAdmin = false;
                alert("Modo de consulta reativado.");
            }
            atualizarInterface();
        }

        function guardarPesca(e) {
            e.preventDefault();
            if (!isAdmin) return alert("Erro: Ative o Modo Edição primeiro.");

            const novaPesca = {
                id: Date.now(),
                data: document.getElementById('data').value || new Date().toISOString().substring(0, 10),
                local: document.getElementById('local').value || 'Não especificado',
                lua: document.getElementById('lua').value || 'Nova',
                horaInicio: document.getElementById('hora-inicio').value || 'N/A',
                horaFim: document.getElementById('hora-fim').value || 'N/A',
                totalCapturas: parseInt(document.getElementById('total-capturas').value) || 0,
                mareTipo: document.getElementById('mare-tipo').value || 'Enchente',
                mareAltura: document.getElementById('mare-altura').value || 'N/A',
                ondas: document.getElementById('ondas').value || 'N/A',
                vento: document.getElementById('vento').value || 'N/A',
                iscos: document.getElementById('iscos').value || 'N/A',
                peixes: document.getElementById('peixes').value || 'N/A'
            };

            pescas.unshift(novaPesca);
            localStorage.setItem('surfcasting_logs', JSON.stringify(pescas));
            
            document.getElementById('form-pesca').reset();
            if(document.getElementById('data')) {
                document.getElementById('data').value = new Date().toISOString().substring(0, 10);
            }
            
            atualizarInterface();
        }

        function eliminarPesca(id) {
            if (!isAdmin) return alert("Erro: Não tens permissões.");
            if (confirm("Tens a certeza que queres eliminar este registo?")) {
                pescas = pescas.filter(p => p.id !== id);
                localStorage.setItem('surfcasting_logs', JSON.stringify(pescas));
                atualizarInterface();
            }
        }

        function atualizarInterface() {
            try {
                const seccaoForm = document.getElementById('seccao-formulario');
                const btnToggle = document.getElementById('btn-admin-toggle');
                const txtLock = document.getElementById('txt-lock');
                
                if (seccaoForm && btnToggle && txtLock) {
                    if (isAdmin) {
                        seccaoForm.classList.remove('hidden');
                        btnToggle.className = "flex items-center gap-2 bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg text-sm font-medium transition text-white cursor-pointer select-none";
                        txtLock.innerText = "🔓 Modo Edição (Admin)";
                    } else {
                        seccaoForm.classList.add('hidden');
                        btnToggle.className = "flex items-center gap-2 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition text-amber-400 cursor-pointer select-none";
                        txtLock.innerText = "🔒 Modo Consulta";
                    }
                }

                renderHistorico();
                calcularMetricas();
            } catch (err) {
                console.error("Erro na interface:", err);
            }
        }

        function renderHistorico() {
            const container = document.getElementById('historico-lista');
            if (!container) return;

            if (!pescas || pescas.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-8 text-sm">Ainda não há saídas registadas no diário.</p>`;
                return;
            }

            container.innerHTML = pescas.map(p => {
                if (!p) return '';
                const totalPeixes = p.totalCapturas !== undefined ? p.totalCapturas : 0;
                const textoPeixes = p.peixes ? String(p.peixes) : '';
                const isGrade = totalPeixes === 0 || textoPeixes.toLowerCase().includes('grade');
                
                const botaoEliminar = isAdmin ? `
                    <button onclick="eliminarPesca(${p.id})" class="absolute top-4 right-4 text-slate-500 hover:text-red-400 transition cursor-pointer" title="Eliminar">
                        🗑️
                    </button>
                ` : '';

                return `
                    <div class="bg-slate-900 border ${isGrade ? 'border-amber-900/40 bg-amber-950/10' : 'border-slate-700'} p-4 rounded-lg relative group transition hover:border-slate-600">
                        ${botaoEliminar}
                        
                        <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 mb-2 text-xs font-semibold text-slate-400">
                            <span class="text-blue-400 flex items-center gap-1 text-sm font-bold">
                                📅 ${formatarData(p.data || '')}
                            </span>
                            <span class="text-emerald-400 flex items-center gap-1 text-sm font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">
                                📍 ${p.local || 'Não especificado'}
                            </span>
                            <span class="bg-slate-800 px-2 py-0.5 rounded border border-slate-700 text-slate-300">
                                ⏱️ ${p.horaInicio || 'N/A'} às ${p.horaFim || 'N/A'}
                            </span>
                        </div>

                        <div class="flex flex-wrap gap-2 text-xs mb-3 text-slate-300">
                            <span class="bg-slate-800/50 px-2 py-1 rounded border border-slate-700/40">${p.lua || 'Nova'}</span>
                            <span class="bg-slate-800/50 px-2 py-1 rounded border border-slate-700/40">${p.mareTipo || 'Enchente'} (${p.mareAltura || 'N/A'}m)</span>
                            <span class="bg-slate-800/50 px-2 py-1 rounded border border-slate-700/40">Mar: ${p.ondas || 'N/A'}m</span>
                            <span class="bg-slate-800/50 px-2 py-1 rounded border border-slate-700/40">Vento: ${p.vento || 'N/A'}</span>
                        </div>

                        <div class="text-xs my-2 py-2 border-t border-slate-800/60">
                            <span class="text-slate-500 block mb-0.5">Iscos:</span> 
                            <span class="text-cyan-300 font-medium">${p.iscos || 'N/A'}</span>
                        </div>

                        <div class="mt-2 pt-2 border-t border-slate-800/40 flex justify-between items-start gap-4">
                            <div class="text-sm flex-1">
                                <span class="text-xs text-slate-500 block">Detalhe das Peças:</span>
                                <p class="${isGrade ? 'text-amber-400/80 italic' : 'text-emerald-400 font-medium'}">${textoPeixes || 'Grade'}</p>
                            </div>
                            <div class="text-right whitespace-nowrap">
                                <span class="text-xs text-slate-500 block">Capturas</span>
                                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold ${isGrade ? 'bg-amber-950/60 text-amber-400 border border-amber-800/60' : 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/60'}">
                                    ${totalPeixes} peixes
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatarData(dataStr) {
            if(!dataStr) return 'N/A';
            const partes = dataStr.split('-');
            if(partes.length !== 3) return dataStr;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function calcularMetricas() {
            try {
                const total = pescas.length;
                const statTotal = document.getElementById('stat-total');
                const statPeixesTotal = document.getElementById('stat-peixes-total');
                const statSucesso = document.getElementById('stat-sucesso');
                
                if (statTotal) statTotal.innerText = total;

                let totalPeixesGlobal = 0;
                pescas.forEach(p => { if(p) totalPeixesGlobal += (parseInt(p.totalCapturas) || 0); });
                if (statPeixesTotal) statPeixesTotal.innerText = totalPeixesGlobal;

                if (total === 0) {
                    if (statSucesso) statSucesso.innerText = '0%';
                    ['best-local', 'best-lua', 'best-mare', 'best-isco'].forEach(id => {
                        if(document.getElementById(id)) document.getElementById(id).innerText = '-';
                    });
                    return;
                }

                const saídasComSucesso = pescas.filter(p => p && (parseInt(p.totalCapturas) || 0) > 0);
                const taxaSucesso = Math.round((saídasComSucesso.length / total) * 100);
                if (statSucesso) statSucesso.innerText = `${taxaSucesso}%`;

                if (saídasComSucesso.length === 0) {
                    ['best-local', 'best-lua', 'best-mare', 'best-isco'].forEach(id => {
                        if(document.getElementById(id)) document.getElementById(id).innerText = 'Sem capturas';
                    });
                    return;
                }

                let locais = {}, luas = {}, mares = {}, iscosContador = {};

                saídasComSucesso.forEach(p => {
                    if (p.local) { const loc = p.local.trim(); locais[loc] = (locais[loc] || 0) + 1; }
                    if (p.lua) luas[p.lua] = (luas[p.lua] || 0) + 1;
                    if (p.mareTipo) mares[p.mareTipo] = (mares[p.mareTipo] || 0) + 1;
                    if (p.iscos) {
                        p.iscos.split(',').forEach(isco => {
                            const limpo = isco.trim().toLowerCase();
                            if(limpo) iscosContador[limpo] = (iscosContador[limpo] || 0) + 1;
                        });
                    }
                });

                if (document.getElementById('best-local')) document.getElementById('best-local').innerText = obterMaiorObjeto(locais);
                if (document.getElementById('best-lua')) document.getElementById('best-lua').innerText = obterMaiorObjeto(luas);
                if (document.getElementById('best-mare')) document.getElementById('best-mare').innerText = obterMaiorObjeto(mares);
                
                const melhorIsco = obterMaiorObjeto(iscosContador);
                if (document.getElementById('best-isco')) {
                    document.getElementById('best-isco').innerText = melhorIsco !== '-' ? melhorIsco.charAt(0).toUpperCase() + melhorIsco.slice(1) : '-';
                }
            } catch (err) {
                console.error("Erro nas métricas:", err);
            }
        }

        function obterMaiorObjeto(obj) {
            const keys = Object.keys(obj);
            if(keys.length === 0) return '-';
            return keys.reduce((a, b) => obj[a] > obj[b] ? a : b, '-');
        }

        function exportarDados() {
            if (!pescas || pescas.length === 0) return alert("Não existem dados para exportar.");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(pescas, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `surfcasting_logs_${new Date().toISOString().substring(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function exportarCSV() {
            if (!pescas || pescas.length === 0) return alert("Não existem dados para exportar.");
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "Data;Local;Hora Inicio;Hora Fim;Total Capturas;Fase da Lua;Tipo de Mare;Altura Mare (m);Ondas (m);Vento;Iscos;Peixes Pescados\n";

            pescas.forEach(p => {
                if(!p) return;
                const altMare = p.mareAltura ? String(p.mareAltura).replace('.', ',') : 'N/A';
                const tamOndas = p.ondas ? String(p.ondas).replace('.', ',') : 'N/A';
                
                let linha = [
                    formatarData(p.data || ''),
                    `"${(p.local || 'N/A').replace(/"/g, '""')}"`,
                    p.horaInicio || 'N/A',
                    p.horaFim || 'N/A',
                    p.totalCapturas || 0,
                    p.lua || 'N/A',
                    p.mareTipo || 'N/A',
                    altMare,
                    tamOndas,
                    `"${(p.vento || 'N/A').replace(/"/g, '""')}"`,
                    `"${(p.iscos || 'N/A').replace(/"/g, '""')}"`,
                    `"${(p.peixes || 'N/A').replace(/"/g, '""').replace(/\n/g, ' ')}"`
                ].join(";");
                csvContent += linha + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", encodedUri);
            downloadAnchor.setAttribute("download", `relatorio_pesca_surfcasting.csv`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
